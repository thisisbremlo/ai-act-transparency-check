                "name": "What does EU AI Act Article 50 cover?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Article 50 sets transparency obligations for certain AI systems, including informing people when they interact with AI and disclosing certain AI-generated or manipulated content. The binding source is Regulation (EU) 2024/1689."

                "@type": "Question",
                "name": "When do the Article 50 transparency obligations apply?",
                "acceptedAnswer": {
                  "@type": "Answer",

                "@type": "Question",

                "acceptedAnswer": {
                  "@type": "Answer",
